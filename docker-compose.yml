version: '3.8'

services:
  # 0. Caddy 网关 (处理 HTTPS)
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80" # HTTP (自动重定向到 HTTPS)
      - "443:443" # HTTPS
      - "443:443/udp" # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - voice-service
    networks:
      - excalidraw-network

  # 1. 前端服务
  frontend:
    build:
      context: .
      dockerfile: excalidraw-plus/Dockerfile
      args:
        # API 请求通过 Caddy 代理，使用相对路径
        - VITE_API_URL=/api
        - VITE_VOICE_URL=/voice
    # 不需要对外暴露端口，只给 Caddy 访问
    expose:
      - "80"
    depends_on:
      - backend
    restart: always
    networks:
      - excalidraw-network

  # 2. 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: servers/api-service/Dockerfile
    expose:
      - "6601"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/excalidraw_plus
      - REDIS_URL=redis://redis:6379
      - PORT=6601
      # CORS 配置 - 本地开发使用 localhost，生产环境替换为你的域名
      - CORS_ORIGIN=https://localhost,https://YOUR_DOMAIN.com
      - JWT_SECRET=change_this_secret_in_production
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - excalidraw-network

  # 3. 语音识别服务
  voice-service:
    build:
      context: servers/aliyunasr
      dockerfile: Dockerfile
    expose:
      - "4408"
    environment:
      - PORT=4408
      # 语音服务本身运行在 HTTP，HTTPS 由 Caddy 处理
      - ENABLE_HTTPS=false
    restart: always
    networks:
      - excalidraw-network

  # 4. 数据库 (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=excalidraw_plus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - excalidraw-network

  # 5. 缓存 (Redis)
  redis:
    image: redis:alpine
    restart: always
    networks:
      - excalidraw-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:


networks:
  excalidraw-network:
    driver: bridge
