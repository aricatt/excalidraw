version: '3.8'

services:
  # 0. Caddy 网关 (处理 HTTPS)
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - voice-service

  # 1. 前端服务
  frontend:
    build:
      context: .
      dockerfile: excalidraw-plus/Dockerfile
      args:
        # 注意：这里 API URL 应该指向 Caddy 的域名/IP
        # 如果是本地测试，用 localhost
        # 如果是线上，用 https://YOUR_DOMAIN.com
        - VITE_API_URL=/api
    # 不需要对外暴露端口，只给 Caddy 访问
    expose:
      - "80"
    depends_on:
      - backend
    restart: always

  # 2. 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: servers/api-service/Dockerfile
    expose:
      - "6601"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/excalidraw_plus
      - REDIS_URL=redis://redis:6379
      - PORT=6601
      # CORS 允许你的域名
      - CORS_ORIGIN=https://YOUR_DOMAIN.com
      - JWT_SECRET=change_this_secret_in_production
    depends_on:
      - db
      - redis
    restart: always

  # 3. 语音识别服务
  voice-service:
    build:
      context: servers/aliyunasr
      dockerfile: Dockerfile
    expose:
      - "4408"
    environment:
      - PORT=4408
      - ENABLE_HTTPS=false # 让它运行在 HTTP 模式
    restart: always

  # 4. 数据库 (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=excalidraw_plus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # 5. 缓存 (Redis)
  redis:
    image: redis:alpine
    restart: always

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
