version: '3.8'

services:
  # 0. Caddy 网关 (处理 HTTPS)
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80" # HTTP (自动重定向到 HTTPS)
      - "443:443" # HTTPS
      - "443:443/udp" # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - voice-service
    networks:
      - excalidraw-network

  # 1. 前端服务
  frontend:
    build:
      context: .
      dockerfile: excalidraw-plus/Dockerfile
      args:
        # API 请求通过 Caddy 代理，使用相对路径
        - VITE_API_URL=/api
        - VITE_VOICE_URL=/voice
    # 不需要对外暴露端口，只给 Caddy 访问
    expose:
      - "80"
    depends_on:
      - backend
    restart: always
    networks:
      - excalidraw-network

  # 2. 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: servers/api-service/Dockerfile
    expose:
      - "6601"
    environment:
      # 本地开发使用容器内的 MySQL
      - DATABASE_URL=mysql://excalidraw:excalidraw_password@mysql:3306/excalidraw_plus
      # Redis 使用本地容器
      - REDIS_URL=redis://redis:6379
      - PORT=6601
      # CORS 配置
      - CORS_ORIGIN=https://localhost,https://YOUR_DOMAIN.com
      - JWT_SECRET=local_dev_secret_change_in_production
      - NODE_ENV=development
    depends_on:
      - mysql
      - redis
    restart: always
    networks:
      - excalidraw-network

  # 3. 语音识别服务
  voice-service:
    build:
      context: servers/aliyunasr
      dockerfile: Dockerfile
    expose:
      - "4408"
    environment:
      - PORT=4408
      # 语音服务本身运行在 HTTP，HTTPS 由 Caddy 处理
      - ENABLE_HTTPS=false
    restart: always
    networks:
      - excalidraw-network

  # 4. 数据库 (MySQL) - 本地开发专用
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=excalidraw_plus
      - MYSQL_USER=excalidraw
      - MYSQL_PASSWORD=excalidraw_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    networks:
      - excalidraw-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "excalidraw", "-pexcalidraw_password" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. 缓存 (Redis)
  redis:
    image: redis:alpine
    restart: always
    networks:
      - excalidraw-network
    # 如果需要持久化 Redis 数据，取消下面的注释
    # volumes:
    #   - redis_data:/data
    # command: redis-server --appendonly yes

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
    # 如果启用 Redis 持久化，取消下面的注释
    # redis_data:

networks:
  excalidraw-network:
    driver: bridge
